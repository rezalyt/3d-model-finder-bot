services:
  - type: web
    name: 3d-model-finder-bot
    runtime: docker
    plan: free
    region: frankfurt
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SKETCHFAB_API_TOKEN
        sync: false
      - key: POLY_PIZZA_KEY
        sync: false
      - key: SMITHSONIAN_API_KEY
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_PATH
        value: /telegram/webhook
      - key: SEARCH_LIMIT
        value: "12"
      - key: PROVIDER_LIMIT
        value: "30"
      - key: HTTP_TIMEOUT_MS
        value: "15000"
