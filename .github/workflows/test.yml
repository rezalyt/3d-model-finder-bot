name: tests

on:
  push:
    branches: [main, hardening-readme-tests-rate-limit, search-quality-overhaul, landscape-search-v1, fix/search-relevance-v2]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -q

  search-service-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: search-service/package.json
      - run: npm install --prefix search-service --omit=dev
      - run: npm test --prefix search-service
      - run: npm run check --prefix search-service

  provider-benchmark:
    runs-on: ubuntu-latest
    needs: search-service-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: search-service/package.json
      - run: npm install --prefix search-service --omit=dev
      - run: npm run benchmark --prefix search-service
      - uses: actions/upload-artifact@v4
        with:
          name: landscape-aec-benchmark
          path: search-service/benchmark-results.json
